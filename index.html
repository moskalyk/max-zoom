<script>
    async function main(max) {
        const wait = (ms) => new Promise((res) => setTimeout(res,ms))
        
        
        for(let i = 0; i < 18; i++){
            await wait(13)
            if(i <= 15) document.getElementById(String(i)).style.fill = 'teal'
            else document.getElementById(String(i)).style.fill = 'red'
            
        }
        
        await wait(150)
        
        for(let i = 17; i >= 0 ; i--){
            await wait(13)
            if(i <= 15) document.getElementById(String(i)).style.fill = 'white'
            else document.getElementById(String(i)).style.fill = 'white'
            
        }
        
        for(let i = 0; i <= max ; i++){
            await wait(40)
            if(i <= 15) document.getElementById(String(i)).style.fill = 'teal'
            else document.getElementById(String(i)).style.fill = 'red'
            
        }
        
    }

    function setDate() {
        const d = new Date();
        let day = d.getDate(); // https://commons.wikimedia.org/wiki/Category:SVG_simplified_7segment_digits
        console.log(day)
        document.getElementById('digi-3b').style.fill = 'white'
        document.getElementById('digi-1b').style.fill = 'white'
        document.getElementById('digi-7b').style.fill = 'white'
        document.getElementById('digi-2a').style.fill = 'white'

        switch(day){
            case 27:
            // top
            document.getElementById('digi-7b').style.fill = 'black'
            document.getElementById('digi-2a').style.fill = 'black'
            break;
            
            case 7:
            // top
            document.getElementById('digi-7b').style.fill = 'black'
            break;
        }
    }
